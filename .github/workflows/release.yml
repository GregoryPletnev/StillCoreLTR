name: Release

# Publishes a StillCore LTR release when a tag like ltr-v1.2.0 is pushed.
#
# LTR tags carry the "ltr-" prefix so they never clash with the original
# StillCore's v1.x / v2.x tags, which exist in any clone that fetched upstream.
#
# Signing is optional. With the secrets below the DMG is signed with a
# Developer ID certificate, notarized and stapled (`make release`). Without
# them the workflow still publishes an ad-hoc signed DMG (`make dmg`) and says
# so in the release notes.
#
#   MACOS_CERTIFICATE_P12       base64 of the Developer ID Application .p12
#   MACOS_CERTIFICATE_PASSWORD  password of that .p12
#   DEVELOPMENT_TEAM            Apple team id, e.g. 5Q4AEAVS86
#   NOTARY_APPLE_ID             Apple ID used for notarization
#   NOTARY_PASSWORD             app-specific password for that Apple ID

on:
  push:
    tags:
      - "ltr-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. ltr-v1.1.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: macos-26
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      DMG: StillCoreLTR.dmg

    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Check that the tag matches the app version
        id: version
        run: |
          set -euo pipefail
          version="${TAG#ltr-v}"
          versions="$(grep -Eo 'MARKETING_VERSION = [0-9.]+;' StillCore.xcodeproj/project.pbxproj \
            | sed -E 's/.* ([0-9.]+);/\1/' | sort -u)"
          if [ "$versions" != "$version" ]; then
            echo "::error::Tag $TAG wants version $version, project has: $versions"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > .release-notes.md
          if [ ! -s .release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section for [$version]"
            exit 1
          fi

      - name: Decide on signing
        id: signing
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
        run: |
          if [ -n "$P12" ] && [ -n "$TEAM" ] && [ -n "$APPLE_ID" ]; then
            echo "mode=notarized" >> "$GITHUB_OUTPUT"
          else
            echo "mode=adhoc" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing secrets are not set; publishing an ad-hoc signed DMG."
          fi

      - name: Import Developer ID certificate
        if: steps.signing.outputs.mode == 'notarized'
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/release.keychain-db"
          keychain_password="$(uuidgen)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security default-keychain -d user -s "$keychain"
          rm -f "$RUNNER_TEMP/cert.p12"
          xcrun notarytool store-credentials StillCore-Notarization \
            --apple-id "$APPLE_ID" --team-id "$TEAM" --password "$NOTARY_PASSWORD"

      - name: Build notarized DMG
        if: steps.signing.outputs.mode == 'notarized'
        env:
          TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: make release DEVELOPMENT_TEAM="$TEAM"

      - name: Build ad-hoc DMG
        if: steps.signing.outputs.mode == 'adhoc'
        run: |
          make dmg ADHOC=1
          cat >> .release-notes.md <<'EOF'

          ---

          **This build is not notarized.** macOS will refuse to open it the first
          time. After copying `StillCoreLTR.app` to Applications, run once:

          ```sh
          xattr -dr com.apple.quarantine /Applications/StillCoreLTR.app
          ```
          EOF

      - name: Checksum
        run: shasum -a 256 "$DMG" | tee "$DMG.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="StillCore LTR ${{ steps.version.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DMG" "$DMG.sha256" --clobber
            gh release edit "$TAG" --title "$title" --notes-file .release-notes.md
          else
            gh release create "$TAG" "$DMG" "$DMG.sha256" \
              --title "$title" --notes-file .release-notes.md --verify-tag
          fi

      - name: Remove signing keychain
        if: always() && steps.signing.outputs.mode == 'notarized'
        run: security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true
